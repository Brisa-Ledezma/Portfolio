# Entorno de desarrollo. Uso: docker compose up --build

name: portfolio

services:
  front:
    build:
      context: ./front
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      # En Windows y macOS los cambios de archivos no llegan al contenedor por eventos.
      VITE_USE_POLLING: "true"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    depends_on:
      - back

  back:
    build:
      context: ./back
      target: dev
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - ./back:/app
      - back_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Solo accesible desde esta máquina, no desde la red.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # Datos de PostgreSQL: sobreviven a reinicios y a `docker compose down`.
  db_data:
  # Dependencias instaladas dentro del contenedor, separadas de las de la máquina.
  front_node_modules:
  back_node_modules:
